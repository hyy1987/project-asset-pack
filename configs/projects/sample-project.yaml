project_id: sample-project
project_name: 示例项目

workbench:
  pre_project_materials: inputs/pre-project
  allow_code_changes: true

git:
  remote_base_url: git@github.com:your-org
  default_branch: main
  create_remote: true
  remote_visibility: private

repositories:
  - name: frontend
    path: ../sample-project/sample-project-frontend
    description: 前端应用仓库
  - name: backend
    path: ../sample-project/sample-project-backend
    description: 后端服务仓库
  - name: database
    path: ../sample-project/sample-project-database
    description: 数据库结构、迁移和种子数据仓库

documents:
  requirements:
    - ../sample-project/sample-project-docs/inputs/pre-project
  designs:
    - ../sample-project/sample-project-docs/docs
  api:
    - ../sample-project/sample-project-docs/docs
  database:
    - ../sample-project/sample-project-database
  tests:
    - ../sample-project/sample-project-backend/tests
  defects:
    - ../sample-project/sample-project-docs/docs
  delivery:
    - ../sample-project/sample-project-docs/docs

security:
  rule_set: default-outsourcing-project

quality:
  commands:
    - name: config check
      cwd: .
      run: python scripts/check_project_config.py --project sample-project
      timeout_seconds: 60

output:
  generated: outputs/generated/asset-pack
  reviewed: outputs/reviewed/asset-pack
